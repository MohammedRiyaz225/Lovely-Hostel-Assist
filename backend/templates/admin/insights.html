{% extends "admin/base.html" %}
{% block title %} – AI Insights{% endblock %}

{% block content %}
<h1>🤖 AI Insights</h1>

<div class="cards-row">
  <div class="stat-card">
    <div class="num" id="dup-count" style="color:#f87171">–</div>
    <div class="label">Duplicate Complaints</div>
  </div>
  <div class="stat-card">
    <div class="num" id="top-cat" style="color:#22d3ee;font-size:1.2rem">–</div>
    <div class="label">Top Category</div>
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
  <div class="card">
    <h2>Top 5 Categories</h2>
    <table>
      <thead><tr><th>Category</th><th>Count</th></tr></thead>
      <tbody id="top-cat-body"></tbody>
    </table>
  </div>
  <div class="card">
    <h2>Recurring Issues by Block</h2>
    <table>
      <thead><tr><th>Block</th><th>Category</th><th>Count</th></tr></thead>
      <tbody id="recurring-body"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function load() {
  const T = getToken();
  const H = {Authorization: `Bearer ${T}`};
  const data = await fetch('/api/admin/insights', {headers: H}).then(r => r.json());

  document.getElementById('dup-count').textContent = data.duplicateCount;
  document.getElementById('top-cat').textContent   = data.topCategories[0]?.category || '–';

  document.getElementById('top-cat-body').innerHTML =
    data.topCategories.map(c =>
      `<tr><td><span class="badge badge-ai">${c.category}</span></td><td>${c.count}</td></tr>`
    ).join('');

  document.getElementById('recurring-body').innerHTML =
    data.recurringIssuesByBlock.map(r =>
      `<tr><td>Block ${r.block}</td><td><span class="badge badge-ai">${r.category}</span></td><td>${r.count}</td></tr>`
    ).join('') || '<tr><td colspan="3" style="color:var(--muted);text-align:center">No recurring issues detected yet.</td></tr>';
}
load();
</script>
{% endblock %}
